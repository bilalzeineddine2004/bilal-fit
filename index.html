function parseQty(p){
  const s=" "+p.replace(/½/g," 0.5 ").replace(/(\d+)\s*\/\s*(\d+)/g,(m,a,b)=>" "+(a/b)+" ")+" ";
  let size=1;if(/\b(large|big|extra|huge)\b/.test(s))size=1.35;if(/\b(small|mini|light)\b/.test(s))size=.7;
  let m;
  if((m=s.match(/(\d+(?:\.\d+)?)\s*(g|grams?|gr)\b/)))return{g:+m[1],size:1};
  if((m=s.match(/(\d+(?:\.\d+)?)\s*(oz|ounces?)\b/)))return{g:+m[1]*28.35,size:1};
  if((m=s.match(/(\d+(?:\.\d+)?)\s*ml\b/)))return{g:+m[1],size:1};
  if((m=s.match(/\b(\d+(?:\.\d+)?|a|an|one|two|three|half)\s*cups?\b/)))return{cups:isNaN(+m[1])?WN[m[1]]:+m[1],size};
  if((m=s.match(/\b(\d+(?:\.\d+)?)\b/)))return{count:+m[1],size};
  if((m=s.match(/\b(couple|two|three|four|five|six|seven|eight|nine|ten|half|double)\b/)))return{count:WN[m[1]],size};
  return{size};
}

  const items=[];
  for(const part of parts){
    let rem=" "+part.replace(/-/g," ").replace(/\s+/g," ")+" ";const found=[];
    for(const k of FKEYS){const re=new RegExp("\\s"+esc(k)+"(es|s)?(?=\\s)");const m=rem.match(re);if(m){found.push(k);rem=rem.slice(0,m.index)+" ".repeat(m[0].length)+rem.slice(m.index+m[0].length);}}
    const q=parseQty(part);
    found.forEach(k=>{const f=FDB[k];const qq=found.length===1?q:{size:q.size};
      let g=qq.g!=null?qq.g:qq.cups!=null?qq.cups*(f.cup||f.s):qq.count!=null?qq.count*(f.u||f.s):f.s;
      if(qq.g==null)g*=qq.size||1;g=Math.round(g);
      const sv=g/100;items.push({name:k.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' '),g,cal:Math.round(f.c*sv),p:Math.round(f.p*sv),c:Math.round(f.cb*sv),f:Math.round(f.f*sv)});});
  }
  if(!items.length){if(/breakfast/i.test(d))return{name:"Breakfast",cal:500,p:25,c:55,f:18,items:[]};if(/lunch/i.test(d))return{name:"Lunch",cal:600,p:35,c:60,f:20,items:[]};if(/dinner/i.test(d))return{name:"Dinner",cal:700,p:40,c:65,f:25,items:[]};return{name:desc,cal:400,p:20,c:45,f:15,items:[],guess:true};}
  const t=items.reduce((a,i)=>({cal:a.cal+i.cal,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{cal:0,p:0,c:0,f:0});
  return{name:items.map(i=>i.name).join(' + '),...t,items};
}

// Longest matching keyword wins, so "plank with rotation" beats "plank" and "chest supported row" beats "row".
const normEx=s=>s.toLowerCase().replace(/[°'’]/g,"").replace(/[-_/]/g," ").replace(/\s+/g," ").trim();
function detectEx(name){
  const n=normEx(name);let best=null,bl=0;
  for(const e of EDB){for(const k of e.k){const kk=normEx(k);if(kk.length>bl&&n.includes(kk)){best=e;bl=kk.length;}}}
  const nm=name.charAt(0).toUpperCase()+name.slice(1);
  if(best)return{name:nm,primary:best.p,secondary:best.s,note:"",sets:best.st||3,reps:best.r||"10-12",isCore:!!best.co};
  let p=[],s=[];
  if(/curl|bicep/i.test(n))p=["Biceps"];else if(/press|push|bench/i.test(n)){p=["Chest","Front Delts"];s=["Triceps"];}
  else if(/row|pull/i.test(n)){p=["Upper Back","Lats"];s=["Biceps"];}else if(/squat|lunge/i.test(n)){p=["Quads","Glutes"];s=["Core"];}
  else if(/raise|lateral/i.test(n))p=["Side Delts"];else if(/fly|flye/i.test(n))p=["Chest"];else if(/extension|pushdown|tricep/i.test(n))p=["Triceps"];
  else if(/calf/i.test(n))p=["Calves"];else if(/dead|rdl|hip thrust|glute bridge|swing/i.test(n)){p=["Hamstrings","Glutes"];s=["Lower Back"];}
  else if(/\bab|core|crunch|plank|pallof|woodchop|twist|v.?up|leg raise|dead bug|hollow/i.test(n))return{name:nm,primary:["Core"],secondary:[],note:"",sets:3,reps:"12-15",isCore:true};
  else if(/shrug|trap/i.test(n))p=["Upper Back"];else{p=["Upper Back"];s=["Core"];}
  return{name:nm,primary:p,secondary:s,note:"",sets:3,reps:"10-12",isCore:false};
}

/* ══════ ONE-TIME MIGRATION (v5 → v6) ══════ */
// Old templates are archived (hidden from the picker, kept so past days still display).
// Old logs keyed by exercise position ("2-1") are re-keyed by exercise id ("1c-1"), so reordering never scrambles a log.
(function migrate(){
  if((LS.g("appv")||0)>=APPV)return;
  let t=gTpls();
  if(t&&t.length){
    t=t.map(x=>OLD_IDS.includes(x.id)?{...x,archived:true}:x);
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);if(!k||!k.startsWith("d-"))continue;
      const d=LS.g(k);if(!d||!d.templateId)continue;
      const tp=t.find(x=>x.id===d.templateId);if(!tp||!tp.exercises)continue;
      const re=/^(\d+)-(\d+)(-w|-r)?$/;const ns={},nw={};
      Object.entries(d.sets||{}).forEach(([key,v])=>{const m=key.match(re);const ex=m&&tp.exercises[+m[1]];ns[ex?`${ex.id}-${m[2]}`:key]=v;});
      Object.entries(d.wts||{}).forEach(([key,v])=>{const m=key.match(re);const ex=m&&tp.exercises[+m[1]];nw[ex?`${ex.id}-${m[2]}${m[3]||""}`:key]=v;});
      LS.s(k,{...d,sets:ns,wts:nw});
    }
    const custom=t.filter(x=>!CORE_IDS.includes(x.id));
    t=[...NEW_TPLS,...custom];
  }else t=NEW_TPLS;
  pTpls(t);
  // tag existing history days with their template so the weekly counts work
  const h=gHist();Object.keys(h).forEach(d=>{if(h[d].tplId===undefined){const dd=LS.g(`d-${d}`);h[d].tplId=dd?.templateId||null;}});pHist(h);
  LS.s("appv",APPV);
})();

  const tots={cal:dd.meals.reduce((a,m)=>a+(m.cal||0),0),p:dd.meals.reduce((a,m)=>a+(m.p||0),0),c:dd.meals.reduce((a,m)=>a+(m.c||0),0),f:dd.meals.reduce((a,m)=>a+(m.f||0),0)};

  // Save reads fresh from LS, merges the patch, writes back, then rebuilds that day's history row.
  const save=(patch)=>{
    const prev=gDay(curDate);const next={...prev,...patch};pDay(curDate,next);
    const h=gHist();const t=next.templateId?allTpls().find(x=>x.id===next.templateId):null;const wk1=!!t&&t.id==="lw"&&isWeek1(curDate,h);
    const mh={};let setsD=0,setsT=0,vol=0;
    if(t){t.exercises.forEach(ex=>{const n=effSets(ex,t,wk1);setsT+=n;const timed=rng(ex.reps).sec;let any=false;
      for(let si=0;si<n;si++){const k=`${ex.id}-${si}`;if(next.sets[k]){any=true;setsD++;if(!timed)vol+=(+next.wts[k+"-w"]||0)*(+next.wts[k+"-r"]||0);}}
      if(any){(ex.primary||[]).forEach(m=>{mh[m]=(mh[m]||0)+2;});(ex.secondary||[]).forEach(m=>{mh[m]=(mh[m]||0)+1;});}});}
    const ms=next.meals||[];
    h[curDate]={p:ms.reduce((a,m)=>a+(m.p||0),0),cal:ms.reduce((a,m)=>a+(m.cal||0),0),c:ms.reduce((a,m)=>a+(m.c||0),0),f:ms.reduce((a,m)=>a+(m.f||0),0),water:next.water,sleep:next.sleep,bw:next.bw,muscles:mh,dayType:t?.type||"rest",tplId:t?.id||null,tplName:t?.name||"",setsD,setsT,vol:Math.round(vol),minimum:!!next.minimum,dur:next.ss&&next.se?Math.max(1,Math.round((next.se-next.ss)/6e4)):0,habitsD:Object.values(next.habits||{}).filter(Boolean).length,habitsT:gHabits().length};
    pHist(h);rr();
  };
  const saveTpls=t=>{pTpls(t);rr();};
  const saveSL=s=>{pSupps(s);rr();};
  const saveHabits=h=>{pHabits(h);rr();};

  // Rest timer: absolute end timestamp, persisted so it survives the app being backgrounded or reloaded.
  const[timer,setTimer]=useState(0);const[timerOn,setTimerOn]=useState(false);const timerEnd=useRef(0);
  useEffect(()=>{const rt=LS.g("rt");if(rt&&rt.end>Date.now()){timerEnd.current=rt.end;setTimer(Math.ceil((rt.end-Date.now())/1000));setTimerOn(true);}},[]);
  useEffect(()=>{if(!timerOn)return;const id=setInterval(()=>{const left=Math.max(0,Math.ceil((timerEnd.current-Date.now())/1000));setTimer(left);if(left<=0){setTimerOn(false);LS.s("rt",null);clearInterval(id);}},250);return()=>clearInterval(id);},[timerOn]);
  const startTimer=sec=>{timerEnd.current=Date.now()+sec*1000;LS.s("rt",{end:timerEnd.current});setTimer(sec);setTimerOn(true);};
  const stopTimer=()=>{setTimerOn(false);setTimer(0);LS.s("rt",null);};
  useEffect(()=>{const v=()=>{if(!document.hidden)rr();};document.addEventListener("visibilitychange",v);return()=>document.removeEventListener("visibilitychange",v);},[]);

  const nav=[{id:"workout",l:"Workout",e:"◎"},{id:"nutrition",l:"Nutrition",e:"◈"},{id:"tracker",l:"Tracker",e:"◉"},{id:"vitals",l:"Vitals",e:"♡"}];
  return (
    <div style={{fontFamily:"'DM Sans',sans-serif",background:C.bg,color:C.txt,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:"calc(84px + env(safe-area-inset-bottom,0px))"}}>
      <Toast msg={toast}/>
      <PRBurst pr={pr} onDone={()=>setPr(null)}/>
      {/* HERO */}
      <div style={{padding:"calc(16px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 0 max(20px, env(safe-area-inset-left,0px))",background:"linear-gradient(180deg,#1a1610,#0C0C0C)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Plates list={week}/>
            <div style={{fontSize:11,fontWeight:600,color:week.length>=2?C.grn:C.gold,letterSpacing:1.5,textTransform:"uppercase"}}>This week {week.length}/3{week.length>=3?" · done":week.length===2?" · floor hit":""}</div>
          </div>
          <div style={{fontSize:11,color:C.sub}}>{niceD(curDate)}</div>
        </div>
        <div style={{fontFamily:"'Oswald'",fontSize:40,fontWeight:700,lineHeight:1}}>{curDate===todayStr?"TODAY":dayN[cDow].toUpperCase()}</div>
        <div style={{fontFamily:"'Oswald'",fontSize:40,fontWeight:700,lineHeight:1,color:tpl?.color||C.gold}}>{tpl?.name?.toUpperCase()||"NO SESSION SET"}</div>
        {/* Date Nav */}
        <div style={{display:"flex",alignItems:"center",gap:6,marginTop:12,paddingBottom:12}}>
          <button onClick={()=>setCurDate(fmt(addD(parse(curDate),-1)))} style={{background:"none",border:"1px solid #333",borderRadius:8,padding:"6px 10px",color:C.sub,fontSize:16,cursor:"pointer"}}>‹</button>
          <div style={{flex:1,display:"flex",gap:3}}>{[0,1,2,3,4,5,6].map(i=>{
            const td=fmt(addD(parse(curDate),i-cDow));const sel=td===curDate;const isT=td===todayStr;const dayDD=gDay(td);const dayTpl=dayDD.templateId?tpls.find(x=>x.id===dayDD.templateId):null;
            return <button key={i} onClick={()=>setCurDate(td)} style={{flex:1,padding:"5px 0",borderRadius:6,border:`1px solid ${sel?dayTpl?.color||C.gold:"#1a1a1a"}`,background:sel?(dayTpl?.color||C.gold)+"33":"transparent",color:sel?dayTpl?.color||C.gold:C.mut,fontSize:10,fontWeight:700,cursor:"pointer",position:"relative",fontFamily:"'DM Sans'"}}>{shortD[i]}{isT&&<div style={{width:4,height:4,borderRadius:"50%",background:C.gold,position:"absolute",top:1,right:"calc(50% - 2px)"}}/>}{dayTpl&&<div style={{width:"100%",height:2,background:dayTpl.color,borderRadius:1,marginTop:2}}/>}</button>;
          })}</div>
          <button onClick={()=>setCurDate(fmt(addD(parse(curDate),1)))} style={{background:"none",border:"1px solid #333",borderRadius:8,padding:"6px 10px",color:C.sub,fontSize:16,cursor:"pointer"}}>›</button>
          {curDate!==todayStr&&<button onClick={()=>setCurDate(todayStr)} style={{background:C.gold,border:"none",borderRadius:8,padding:"6px 8px",color:"#000",fontSize:10,fontWeight:700,cursor:"pointer"}}>Now</button>}
        </div>

      <div style={{padding:"0 max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px))"}}>
        {tab==="workout"&&<WTab {...{dd,save,tpl,tpls,saveTpls,exs,totalS,doneS,w1,hist,timer,timerOn,startTimer,stopTimer,flash,curDate,setPr,cDow}}/>}

      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,display:"flex",background:"#111",borderTop:"1px solid #1a1a1a",zIndex:100,padding:"6px 0 max(14px, env(safe-area-inset-bottom,0px))"}}>
        {nav.map(t=> <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",color:tab===t.id?C.gold:C.mut,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 0",cursor:"pointer",fontFamily:"'DM Sans'"}}><span style={{fontSize:20}}>{t.e}</span><span style={{fontSize:10,fontWeight:700}}>{t.l}</span></button>)}
      </div>
    </div>
  );
}

const RULES=["Do the next session in the rotation: Upper A → Lower + Core → Upper B. A missed Monday becomes a Tuesday, not a lost week.","Planned slot is 10–12 in the morning. If that falls through, 9pm the same day is the backup.","Weekly target is 3. The floor is 2, and 2 still counts as a good week.","Never miss twice in a row.","Low on time or energy? Do the first two exercises only (about 20 minutes) and tap Minimum session. It counts.","Keep a day between the two upper sessions. If a miss forces a squeeze, skip Lower that week.","When every set hits the top of its rep range, add weight next time."];

function SessClock({dd,save,flash,curDate}){
  const[,tick]=useState(0);
  const live=!!dd.ss&&!dd.se;
  useEffect(()=>{if(!live)return;const id=setInterval(()=>tick(n=>n+1),1000);return()=>clearInterval(id);},[live]);
  const pill={padding:"8px 12px",borderRadius:10,fontSize:14,fontWeight:700,fontFamily:"'Oswald'",cursor:"pointer",border:"1px solid #333",background:C.card,color:C.sub};
  if(!dd.ss)return curDate===today()?<button onClick={()=>{save({ss:Date.now(),se:0});flash("Session started");}} style={pill}>▶ Start</button>:null;
  if(live){const s=Math.floor((Date.now()-dd.ss)/1000);return <button onClick={()=>{const se=Date.now();save({se});flash(`Session done · ${Math.max(1,Math.round((se-dd.ss)/6e4))} min`);}} style={{...pill,border:`1px solid ${C.grn}55`,color:C.grn,background:"#22C55E14"}}>● {mmss(s)} · Finish</button>;}
  return <RemoveBtn label={`✓ ${Math.max(1,Math.round((dd.se-dd.ss)/6e4))} min`} onConfirm={()=>{save({se:0});flash("Timer resumed");}} style={{...pill,color:C.grn}}/>;
}

function NoteCard({dd,save,flash,curDate,placeholder}){

function WTab({dd,save,tpl,tpls,saveTpls,exs,totalS,doneS,w1,hist,timer,timerOn,startTimer,stopTimer,flash,curDate,setPr,cDow}){
  const[tools,setTools]=useState(null);const[adding,setAdding]=useState(false);const[addN,setAddN]=useState("");const[editing,setEditing]=useState(null);const[ef,setEf]=useState({});const[newTplName,setNewTplName]=useState("");
  const live=tpls.filter(t=>!t.archived);

  const assignTpl=id=>{save({templateId:id,sets:{},wts:{},minimum:false});flash("Session set!");};
  const clearTpl=()=>{save({templateId:null,sets:{},wts:{},minimum:false,ss:0,se:0});flash("Cleared");};
  const updTpl=fn=>saveTpls(tpls.map(t=>t.id===tpl.id?{...t,exercises:fn([...t.exercises])}:t));

  const addExToTpl=()=>{if(!addN.trim()||!tpl)return;const det=detectEx(addN);const maxG=Math.max(0,...tpl.exercises.map(e=>parseInt(e.grp)||0));updTpl(x=>[...x,{id:uid(),...det,grp:String(maxG+1),rest:det.isCore?60:90}]);setAddN("");setAdding(false);flash("Added!");};

  const mvEx=(id,dir)=>updTpl(x=>{const i=x.findIndex(e=>e.id===id);const ni=i+dir;if(ni<0||ni>=x.length)return x;[x[i],x[ni]]=[x[ni],x[i]];return x;});
  const svEdit=id=>{updTpl(x=>x.map(e=>e.id===id?{...e,sets:Math.max(1,+ef.sets||e.sets),reps:ef.reps||e.reps,note:ef.note??e.note,grp:String(ef.grp||"").trim()||e.grp,rest:+ef.rest||e.rest||90}:e));setEditing(null);flash("Updated!");};
  const createTpl=()=>{if(!newTplName.trim())return;const nt={id:uid(),name:newTplName,color:["#D4A843","#22C55E","#3B82F6","#A855F7","#E5484D","#F59E0B"][Math.floor(Math.random()*6)],type:"gym",exercises:[]};saveTpls([...tpls,nt]);setNewTplName("");flash("Template created!");};
  const deleteTpl=id=>{saveTpls(tpls.filter(t=>t.id!==id));flash("Deleted");};

  // per-set history for "last time", 40 sessions per exercise
  const updLift=(ex,sets,wts)=>{const L=gLift();const key=ex.name.toLowerCase();const rows=[];
    for(let si=0;si<effSets(ex,tpl,w1);si++){const k=`${ex.id}-${si}`;if(!sets[k])continue;const rv=wts[k+"-r"];const wv=wts[k+"-w"];if(rv==null||String(rv).trim()==="")continue;rows.push({w:wv==null||String(wv).trim()===""?null:+wv,r:+rv});}
    const arr=(L[key]||[]).filter(e=>e.d!==curDate);if(rows.length)arr.push({d:curDate,s:rows});arr.sort((a,b)=>a.d<b.d?-1:1);L[key]=arr.slice(-40);pLift(L);};
  const checkPR=(ex,w,r)=>{if(rng(ex.reps).sec||!(w>0)||!(r>0))return;const e1=e1rm(w,r);const P=gPR();const k=ex.name.toLowerCase();const old=P[k];
    if(!old||e1>old.e1){P[k]={e1,w,r,d:curDate,name:ex.name};pPR(P);if(old){const Lg=gPRLog();Lg.push({d:curDate,name:ex.name,w,r,e1});pPRLog(Lg.slice(-300));setPr({name:ex.name,w,r,e1,prev:old.e1});}}};
  const placeholderW=(last,si,ex)=>{if(ex&&si>0){const prevW=gDay(curDate).wts[`${ex.id}-${si-1}-w`];if(prevW!=null&&String(prevW).trim()!=="")return prevW;}if(!last)return null;const row=last.s[si]||last.s[last.s.length-1];return row&&row.w!=null?row.w:null;};

  const toggleSet=(ex,si)=>{
    const key=`${ex.id}-${si}`;const prev=gDay(curDate);const wasDone=!!prev.sets[key];const wts={...prev.wts};
    if(!wasDone&&(wts[key+"-w"]==null||wts[key+"-w"]==="")){const ph=placeholderW(lastTime(ex.name,curDate),si,ex);if(ph!=null)wts[key+"-w"]=String(ph);}
    const sets={...prev.sets,[key]:!wasDone};const patch={sets,wts};
    if(!wasDone&&!prev.ss&&curDate===today())patch.ss=Date.now();
    save(patch);updLift(ex,sets,wts);
    if(wasDone)return;
    const w=+wts[key+"-w"],r=+wts[key+"-r"];
    if(wts[key+"-w"])LS.s("exw",{...gExW(),[ex.name.toLowerCase()]:wts[key+"-w"]});

    const grp=tpl.exercises.filter(e=>(e.grp||`_${e.id}`)===(ex.grp||`_${ex.id}`));const gi=grp.findIndex(e=>e.id===ex.id);
    const noReps=!wts[key+"-r"];

  };
  const setVal=(ex,si,f,val)=>{const prev=gDay(curDate);const k=`${ex.id}-${si}`;const wts={...prev.wts,[`${k}-${f}`]:val};save({wts});if(prev.sets[k])updLift(ex,prev.sets,wts);};
  const blurVal=(ex,si)=>{const d=gDay(curDate);const k=`${ex.id}-${si}`;if(d.sets[k])checkPR(ex,+d.wts[k+"-w"],+d.wts[k+"-r"]);};

    return (
      <div className="fi" style={{display:"flex",flexDirection:"column",gap:12,paddingTop:8}}>
        <Card>
          <Lbl>{soccerDay?"Today":"Up next"}</Lbl>

  const changeStyle={padding:"6px 10px",borderRadius:8,border:"1px solid #333",background:"transparent",color:C.sub,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans'"};

    <div className="fi" style={{display:"flex",flexDirection:"column",gap:12,paddingTop:8}}>
      <Card style={{borderColor:tpl.color+"55"}}>

  /* ── Gym session ── */
  const groups=groupsOf(exs);
  return (
    <div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4,marginBottom:8,gap:8,flexWrap:"wrap"}}>

        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>

        </div>
      </div>
      <div style={{height:3,background:"#222",borderRadius:2,marginBottom:12}}><div style={{height:"100%",width:`${totalS?(doneS/totalS)*100:0}%`,background:`linear-gradient(90deg,${tpl.color||C.gold},${tpl.color||C.gold}88)`,borderRadius:2,transition:"width .4s"}}/></div>

      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        <button onClick={()=>{save({minimum:!dd.minimum});flash(dd.minimum?"Full session":"Minimum session · it counts");}} style={{padding:"7px 12px",borderRadius:999,border:`1px solid ${dd.minimum?C.gold:"#333"}`,background:dd.minimum?C.gd:"transparent",color:dd.minimum?C.gold:C.sub,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans'"}}>{dd.minimum?"✓ Minimum session":"Minimum session (first 2 exercises)"}</button>

      <div style={{fontSize:12,color:C.sub,marginBottom:12}}>Warm up: 5 min light cardio, then 2 light sets of the first lift.</div>

      {groups.map((g,gi)=>{const sup=g.items.length>1;return <div key={g.g} style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:6}}><span style={{fontFamily:"'Oswald'",fontSize:20,fontWeight:700,color:tpl.color}}>{gi+1}</span><span style={{fontSize:12,color:C.sub}}>{restLabel(g.items)}</span></div>
        {g.items.map((ex,ii)=>{
          const n=effSets(ex,tpl,w1);const r=rng(ex.reps);const tag=sup?`${gi+1}${"abcdef"[ii]}`:"";
          const allD=Array.from({length:n},(_,si)=>dd.sets[`${ex.id}-${si}`]).every(Boolean);
          const last=lastTime(ex.name,curDate);const best=gPR()[ex.name.toLowerCase()];

          if(last&&last.legacy)hint=<span>Last: <b>{last.s[0].w} lbs</b> — beat it</span>;

            hint=<span>Last ({niceD(last.d)}): <b>{parts.join(", ")}</b> → <b style={{color:top?C.grn:tpl.color}}>{r.sec?(top?"hold longer":"beat it by a few seconds"):(top?"add weight today":"beat it by a rep")}</b></span>;}
          else hint=<span style={{color:C.sub}}>First time: pick a weight that leaves about 2 reps in the tank.</span>;
          return (
            <div key={ex.id} style={{background:allD?"#22C55E0C":C.card,border:`1px solid ${allD?"#22C55E33":C.cb}`,borderLeft:sup?`3px solid ${tpl.color}`:undefined,borderRadius:14,padding:"14px 14px",marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:15,fontWeight:700,color:allD?C.grn:C.txt}}>{tag&&<span style={{fontSize:11,color:C.sub,marginRight:6,fontWeight:600}}>{tag}</span>}{ex.name}</div>{ex.note&&<div style={{fontSize:12,color:C.sub,marginTop:3,lineHeight:1.4}}>{ex.note}</div>}</div>

              {tools===ex.id&&(editing===ex.id?<div style={{display:"flex",flexDirection:"column",gap:6,padding:10,background:"#111",borderRadius:8,marginTop:8}}>
                <div style={{display:"flex",gap:6}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.sub}}>Sets</div><input type="number" inputMode="numeric" value={ef.sets} onChange={e=>setEf({...ef,sets:e.target.value})} style={sinp}/></div>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.sub}}>Reps</div><input value={ef.reps} onChange={e=>setEf({...ef,reps:e.target.value})} style={sinp}/></div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.sub}}>Superset group</div><input value={ef.grp} onChange={e=>setEf({...ef,grp:e.target.value})} style={sinp}/></div>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.sub}}>Rest (sec)</div><input type="number" inputMode="numeric" value={ef.rest} onChange={e=>setEf({...ef,rest:e.target.value})} style={sinp}/></div>
                </div>
                <div><div style={{fontSize:10,color:C.sub}}>Cue</div><input value={ef.note} onChange={e=>setEf({...ef,note:e.target.value})} style={sinp}/></div>
                <div style={{fontSize:11,color:C.mut}}>Same group number = done back to back. The rest timer starts after the last one in the group.</div>
                <div style={{display:"flex",gap:6}}><Btn green onClick={()=>svEdit(ex.id)}>Save</Btn><Btn onClick={()=>setEditing(null)}>Cancel</Btn></div>
              </div>:<div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
                <Btn small onClick={()=>{setEditing(ex.id);setEf({sets:ex.sets,reps:ex.reps,note:ex.note||"",grp:ex.grp||"",rest:ex.rest||90});}}>✎ Edit</Btn>
                <Btn small onClick={()=>mvEx(ex.id,-1)}>↑</Btn><Btn small onClick={()=>mvEx(ex.id,1)}>↓</Btn>
                <RemoveBtn label="✕ Remove" onConfirm={()=>rmEx(ex.id)} style={{padding:"5px 10px",borderRadius:6,background:"none",border:`1px solid ${C.red}33`,color:C.red,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'"}}/>
              </div>)}

              <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:10}}>
                {Array.from({length:n},(_,si)=>{
                  const k=`${ex.id}-${si}`;const done=!!dd.sets[k];const wVal=dd.wts[k+"-w"]??"";const rVal=dd.wts[k+"-r"]??"";const ph=placeholderW(last,si,ex);
                  const box={background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 6px",color:C.txt,fontSize:16,outline:"none",fontFamily:"'DM Sans'",textAlign:"center",minWidth:0};
                  return <div key={si} style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.sub,width:24}}>S{si+1}</div>
                    <input type="text" inputMode="decimal" placeholder={ph!=null?String(ph):"lbs"} value={wVal} onChange={e=>setVal(ex,si,"w",e.target.value)} onBlur={()=>blurVal(ex,si)} style={{...box,width:70}} aria-label={`${ex.name} set ${si+1} weight`}/>
                    <span style={{fontSize:10,color:C.mut}}>lbs ×</span>
                    <input type="text" inputMode="numeric" placeholder={r.lo===r.hi?String(r.lo):`${r.lo}–${r.hi}`} value={rVal} onChange={e=>setVal(ex,si,"r",e.target.value)} onBlur={()=>blurVal(ex,si)} style={{...box,width:58}} aria-label={`${ex.name} set ${si+1} ${r.sec?"seconds":"reps"}`}/>
                    <span style={{fontSize:10,color:C.mut}}>{r.sec?"sec":"reps"}</span>
                    <div style={{flex:1}}/>
                    <button onClick={()=>toggleSet(ex,si)} aria-label={done?"Undo set":"Complete set"} style={{width:42,height:42,flexShrink:0,borderRadius:"50%",border:`2px solid ${done?C.grn:"#333"}`,background:done?C.grn:"transparent",color:done?"#000":C.sub,fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'DM Sans'",transition:"all .2s"}}>{done?"✓":""}</button>
                  </div>;
                })}
              </div>
            </div>
          );
        })}
      </div>;})}
      {!adding? <button onClick={()=>setAdding(true)} style={{width:"100%",padding:"12px",borderRadius:12,border:"1px dashed #333",background:"transparent",color:C.sub,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'"}}>+ Add Exercise to Template</button>:<Card><Lbl>Add Exercise</Lbl><div style={{fontSize:11,color:C.sub,marginBottom:8}}>Muscles auto-detected. Saves to this template permanently.</div><div style={{display:"flex",gap:8}}><input placeholder="e.g. Cable Flyes..." value={addN} onChange={e=>setAddN(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addExToTpl()} style={{...inp,flex:1}}/><Btn gold onClick={addExToTpl}>Add</Btn></div><Btn small onClick={()=>setAdding(false)} style={{marginTop:8}}>Cancel</Btn></Card>}
      <div style={{height:12}}/>
      <NoteCard {...{dd,save,flash,curDate}}/>
      <div style={{height:16}}/>
    </div>
  );
}

/* ══════ NUTRITION TAB ══════ */
function NTab({dd,save,tots,mac,tpl,flash}){
  const[desc,setDesc]=useState("");const[res,setRes]=useState(null);const[showM,setShowM]=useState(false);const[f,setF]=useState({n:"",cal:"",p:"",c:"",f:""});const[flex,setFlex]=useState(false);
  const now=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const est=()=>{if(!desc.trim())return;setRes(estFood(desc));};
  const confirmR=fl=>{if(!res)return;const{items,guess,...m}=res;save({meals:[...dd.meals,{...m,flex:fl,time:now()}]});setDesc("");setRes(null);flash("Meal logged!");};
  const addMan=()=>{if(!f.n)return;save({meals:[...dd.meals,{name:f.n,cal:+f.cal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,flex,time:now()}]});setF({n:"",cal:"",p:"",c:"",f:""});setFlex(false);setShowM(false);flash("Meal logged!");};
  const rmMeal=i=>{save({meals:dd.meals.filter((_,j)=>j!==i)});flash("Removed");};
  const addQ=q=>{save({meals:[...dd.meals,{...q,flex:false,time:now()}]});flash("Added!");};
  const fN=dd.meals.filter(m=>m.flex).length;const dl=tpl?.type==="soccer"?"Soccer Day":tpl?.type==="gym"?"Training Day":"Rest Day";

  return (
    <div className="fi" style={{display:"flex",flexDirection:"column",gap:12,paddingTop:8}}>
      <div style={{fontFamily:"'Oswald'",fontSize:28,fontWeight:700}}>NUTRITION</div>
      <div style={{fontSize:12,color:C.gold,fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginTop:-8}}>{dl} · {mac.cal} cal · {mac.p}g protein</div>
      <Card>{[{l:"Calories",v:tots.cal,t:mac.cal,col:C.gold,u:""},{l:"Protein",v:tots.p,t:mac.p,col:C.grn,u:"g"},{l:"Carbs",v:tots.c,t:mac.c,col:C.blu,u:"g"},{l:"Fat",v:tots.f,t:mac.f,col:C.pur,u:"g"}].map((m,i)=> <div key={i} style={{marginBottom:i<3?10:0}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:C.sub,fontWeight:600}}>{m.l}</span><span style={{fontWeight:600}}>{m.v}{m.u} <span style={{color:C.mut}}>/ {m.t}{m.u}</span></span></div><div style={{height:6,background:"#222",borderRadius:3}}><div style={{height:"100%",width:`${Math.min(100,(m.v/m.t)*100)}%`,background:m.col,borderRadius:3,transition:"width .3s"}}/></div></div>)}</Card>
      <Card><Lbl>Log Meal</Lbl>
        <div style={{display:"flex",gap:8}}><input placeholder='e.g. "3 eggs, 2 toast and a banana"' value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&est()} style={{...inp,flex:1}}/><Btn gold onClick={est}>Est.</Btn></div>
        <div style={{fontSize:11,color:C.mut,marginTop:6}}>Amounts help: "200g chicken", "1.5 cups rice", "2 slices pizza".</div>
        {res&&<div style={{marginTop:10,padding:12,background:"#111",borderRadius:10,border:`1px solid ${C.gold}33`}}>
          <div style={{fontSize:14,fontWeight:700,color:C.gold,marginBottom:6}}>{res.name}</div>
          <div style={{display:"flex",gap:8,fontSize:12,color:C.sub,marginBottom:8,flexWrap:"wrap"}}><span><b style={{color:C.txt}}>{res.cal}</b>cal</span><span><b style={{color:C.grn}}>{res.p}g</b>P</span><span><b style={{color:C.blu}}>{res.c}g</b>C</span><span><b style={{color:C.pur}}>{res.f}g</b>F</span></div>
          {res.items?.length>1&&<div style={{display:"flex",flexDirection:"column",gap:2,marginBottom:10}}>{res.items.map((it,i)=> <div key={i} style={{fontSize:11,color:C.sub}}>{it.name} · {it.g}g · {it.cal} cal · {it.p}g P</div>)}</div>}
          {res.guess&&<div style={{fontSize:11,color:C.gold,marginBottom:8}}>Didn't recognise that food, so this is a rough guess. Use Manual for accuracy.</div>}
          <div style={{display:"flex",gap:8}}><Btn green onClick={()=>confirmR(false)} style={{flex:1}}>🥗 Log Clean</Btn><Btn onClick={()=>confirmR(true)} style={{flex:1,background:"#D4A84333",border:`1px solid ${C.gold}44`,color:C.gold}}>🍕 Log Flex</Btn></div>
        </div>}
      </Card>
      <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><Lbl>80/20</Lbl><Btn small onClick={()=>setShowM(!showM)}>Manual</Btn></div><div style={{display:"flex",gap:8}}><div style={{padding:"4px 10px",borderRadius:6,fontSize:12,fontWeight:700,background:C.gd2,color:C.grn}}>{dd.meals.length-fN} Clean</div><div style={{padding:"4px 10px",borderRadius:6,fontSize:12,fontWeight:700,background:"#D4A84322",color:C.gold}}>{fN} Flex</div></div></Card>
      {showM&&<Card><Lbl>Manual</Lbl><div style={{display:"flex",flexDirection:"column",gap:6}}><input placeholder="Meal name" value={f.n} onChange={e=>setF({...f,n:e.target.value})} style={inp}/><div style={{display:"flex",gap:4}}>{[["cal","Cal"],["p","P"],["c","C"],["f","F"]].map(([k,l])=> <input key={k} placeholder={l} type="number" inputMode="numeric" value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})} style={{...sinp,flex:1,minWidth:0}}/>)}</div><div style={{display:"flex",gap:8}}><Btn onClick={()=>setFlex(!flex)} style={{flex:1,background:flex?"#D4A84322":C.card,border:`1px solid ${flex?C.gold+"66":"#333"}`,color:flex?C.gold:C.sub}}>{flex?"🍕 Flex":"🥗 Clean"}</Btn><Btn gold onClick={addMan}>Log Meal</Btn></div></div></Card>}
      {dd.meals.length>0&&<Card><Lbl>Meals</Lbl>{dd.meals.map((m,i)=> <div key={i} style={{display:"flex",alignItems:"center",padding:"8px 0",borderTop:i?"1px solid #1a1a1a":"none",gap:8}}><div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:13,fontWeight:600}}>{m.name}</span>{m.flex&&<span style={{fontSize:8,fontWeight:700,background:"#D4A84333",color:C.gold,padding:"1px 5px",borderRadius:4}}>FLEX</span>}</div><div style={{fontSize:11,color:C.sub,marginTop:1}}>{m.cal}cal·{m.p}gP·{m.c}gC·{m.f}gF{m.time?` · ${m.time}`:""}</div></div><RemoveBtn label="✕" onConfirm={()=>rmMeal(i)} style={{background:"none",border:"1px solid transparent",borderRadius:6,color:C.mut,fontSize:13,cursor:"pointer",padding:"4px 8px",fontFamily:"'DM Sans'"}}/></div>)}</Card>}
      <Card><Lbl>Quick Add</Lbl><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{QM.map((q,i)=> <button key={i} onClick={()=>addQ(q)} style={{display:"flex",flexDirection:"column",gap:1,padding:"7px 10px",borderRadius:8,background:"#111",border:"1px solid #222",color:C.txt,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'"}}>{q.name}<span style={{fontSize:9,color:C.sub}}>{q.cal}cal·{q.p}gP</span></button>)}</div></Card>
      <div style={{height:12}}/>
    </div>
  );
}

/* ══════ TRACKER TAB ══════ */
function WeeklyReview({hist,tpls}){
  const[off,setOff]=useState(0);
  const mon=fmt(addD(parse(mondayOf(today())),-7*off));const days=Array.from({length:7},(_,i)=>fmt(addD(parse(mon),i)));
  const S=sessionsIn(hist,mon);const n=S.length;const H=days.map(d=>hist[d]).filter(Boolean);
  const avg=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  const sets=S.reduce((a,s)=>a+(s.setsD||0),0);const vol=S.reduce((a,s)=>a+(s.vol||0),0);
  const durs=S.map(s=>s.dur).filter(Boolean);const pDays=H.filter(h=>h.p>0);const pAvg=avg(pDays.map(h=>h.p));const pHit=pDays.filter(h=>h.p>=155).length;
  const cAvg=avg(H.filter(h=>h.cal>0).map(h=>h.cal));const sl=avg(H.filter(h=>h.sleep>0).map(h=>h.sleep));
  const bws=days.filter(d=>hist[d]?.bw).map(d=>+hist[d].bw);const bwCh=bws.length>1?(bws[bws.length-1]-bws[0]):null;
  const soccer=H.filter(h=>h.dayType==="soccer").length;const mins=S.filter(s=>s.minimum).length;

}

function MC({data,target,color,unit}){if(data.length<2)return null;const vals=data.map(d=>d.v);const mn=Math.min(...vals,target||Infinity)-5;const mx=Math.max(...vals,target||0)+5;const rng=mx-mn||1;const w=Math.max(260,data.length*36);const h=80;const pts=data.map((d,i)=>({x:16+(i/(data.length-1))*(w-32),y:h-10-((d.v-mn)/rng)*(h-25)}));const ln=pts.map((p,i)=>`${i?"L":"M"} ${p.x} ${p.y}`).join(" ");const tY=target?h-10-((target-mn)/rng)*(h-25):null;return <div style={{overflowX:"auto"}}><svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>{tY!=null&&<><line x1={10} y1={tY} x2={w-10} y2={tY} stroke={color} strokeWidth="1" strokeDasharray="4,4" opacity=".3"/></>}<path d={ln} fill="none" stroke={color} strokeWidth="2"/>{pts.map((p,i)=> <g key={i}><circle cx={p.x} cy={p.y} r="3" fill={color}/><text x={p.x} y={p.y-8} textAnchor="middle" fill={C.sub} fontSize="8">{vals[i]}</text><text x={p.x} y={h-1} textAnchor="middle" fill={C.mut} fontSize="7">{data[i].l}</text></g>)}</svg></div>;}

        </div>}
        {suppList.map(s=> <div key={s.id} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:"1px solid #1a1a1a"}}>
          <button onClick={()=>{save({supps:{...dd.supps,[s.id]:!dd.supps[s.id]}});flash(dd.supps[s.id]?"Unchecked":"Taken!");}} style={{width:28,height:28,borderRadius:8,border:`2px solid ${dd.supps[s.id]?C.grn:"#333"}`,background:dd.supps[s.id]?C.grn:"transparent",color:dd.supps[s.id]?"#000":C.txt,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{dd.supps[s.id]?"✓":""}</button>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{s.name}</div><div style={{fontSize:11,color:C.sub}}>{s.dose}{s.when?` · ${s.when}`:""}</div></div>
          <RemoveBtn label="✕" onConfirm={()=>{saveSL(suppList.filter(x=>x.id!==s.id));flash("Removed");}} style={{background:"none",border:"none",color:C.mut,fontSize:12,cursor:"pointer",padding:"4px 8px",fontFamily:"'DM Sans'"}}/>
        </div>)}
      </Card>
      <Card><Lbl>Checklist</Lbl>{[{l:"Protein 155g+",d:dd.meals.reduce((a,m)=>a+(m.p||0),0)>=155},{l:"Water 3L+",d:dd.water>=12},{l:"Creatine",d:!!dd.supps.creatine},{l:"7+ hrs sleep",d:dd.sleep>=7},{l:"Weight logged",d:!!dd.bw},{l:`Habits ${Object.values(dd.habits||{}).filter(Boolean).length}/${habits.length}`,d:habits.length>0&&Object.values(dd.habits||{}).filter(Boolean).length===habits.length}].map((c,i)=> <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"4px 0",opacity:c.d?1:.4}}><span style={{color:c.d?C.grn:C.mut,fontWeight:700}}>{c.d?"✓":"○"}</span><span style={{fontSize:13}}>{c.l}</span></div>)}</Card>
      <Backup flash={flash}/>
      <div style={{height:12}}/>
    </div>
  );
}

/* ══════ BACKUP (photos excluded) ══════ */
function Backup({flash}){
  const[out,setOut]=useState("");const[inp2,setInp2]=useState("");const[open,setOpen]=useState(false);
  const dump=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);o[k]=localStorage.getItem(k);}return JSON.stringify({app:"znyw",v:APPV,at:new Date().toString(),data:o});};
  const copy=()=>{const s=dump();setOut(s);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>flash("Backup copied · paste it into Notes")).catch(()=>flash("Select the text below and copy it"));}else flash("Select the text below and copy it");};
  const restore=()=>{try{const o=JSON.parse(inp2.trim());if(o.app!=="znyw"||!o.data)throw 0;localStorage.clear();Object.entries(o.data).forEach(([k,v])=>localStorage.setItem(k,v));flash("Restored · reloading");setTimeout(()=>location.reload(),800);}catch(_){flash("That doesn't look like a backup from this app");}};
  return <Card><details open={open} onToggle={e=>setOpen(e.target.open)}><summary><Lbl style={{marginBottom:0}}>Backup & restore ▾</Lbl></summary>
    <div style={{fontSize:12,color:C.sub,lineHeight:1.5,margin:"10px 0"}}>Copy a backup before reinstalling the app or switching phones, and keep it in Notes. Covers workouts, meals, templates and settings. Photos are not included.</div>
    <Btn gold onClick={copy}>Copy backup</Btn>
    {out&&<textarea readOnly value={out} onFocus={e=>e.target.select()} rows={3} style={{...inp,marginTop:8,fontSize:11}}/>}
    <div style={{fontSize:11,color:C.mut,margin:"12px 0 6px"}}>Restore replaces everything on this phone with the backup.</div>
    <textarea value={inp2} onChange={e=>setInp2(e.target.value)} rows={3} placeholder="Paste a backup here" style={{...inp,fontSize:12}}/>
    <div style={{marginTop:8}}><RemoveBtn label="Restore" onConfirm={restore} style={{padding:"8px 14px",borderRadius:8,background:"none",border:"1px solid #333",color:C.sub,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans'"}}/></div>
  </details></Card>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
